      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#23232b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" rx="16" fill="url(#bgGtc)"/>
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
